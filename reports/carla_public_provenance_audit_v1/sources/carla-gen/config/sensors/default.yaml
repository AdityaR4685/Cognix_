camera:
    _target_: carlagen.Sensor
    name: "RGB Camera"
    blueprint: "sensor.camera.rgb"
    location: [0,0,1.8]
    rotation: [0,0,0]
    attributes:
        image_size_x: 1920
        image_size_y: 1080
        fov: 105
        # where FOV should be sharp in cm
        focal_distance: 1000.0
        blur_amount: 1.0
        motion_blur_intensity: 0.45
        motion_blur_max_distortion: 0.35

instance_segmentation:
    _target_: carlagen.Sensor
    name: "Instance Segmentation"
    blueprint: "sensor.camera.instance_segmentation"
    location: [0,0,1.8]
    rotation: [ 0,0,0 ]
    attributes:
        image_size_x: 1920
        image_size_y: 1080
        fov: 105

lidar:
    _target_: carlagen.Sensor
    name: "Semantic LIDAR"
    blueprint: "sensor.lidar.ray_cast_semantic"
    location: [0,0,1.80]
    # location: [0,0,1.80]
    rotation: [0,0,0]
    attributes:
        # 2 x 20
        channels: 64
        rotation_frequency: 60 # kitti paper: 10Hz
        points_per_second: 1300000 # kitti paper: 1300000
        range: 120 # kitti paper: range 120m
        # noise_stddev: 0.0
#        dropoff_general_rate: 0.4
#        dropoff_intensity_limit: 0.8
#        dropoff_zero_intensity: 0.4
#        atmosphere_attenuation_rate: 0.004
        upper_fov: 14 # kitti paper: 26.9
        lower_fov: -16 # kitti paper: 26.9

