# @package _global_
defaults:
  - override /callbacks: test-clip.yaml

callbacks:
  anomaly:
    _target_: carlagen.callback.SpawnMiscCallback    
    distance: [8,13] # distance range in front of the car; fixed if only one value
    lr_offset: [-1,+1] # left right offset in front of the car; fixed if only one value
    every_n_frames: 1
    delay: 8 # delay before the first object is spawned
    frequency: 5
    duration: [5,15]
    cb_seed: ${seed}
    sc_seed: ${seed}
    sensors:
    - name: "Instance Segmentation"
      directory: "anomaly-front"
    - name: "Instance Segmentation Rear"
      directory: "anomaly-rear"
    - name: "Instance Segmentation Left"
      directory: "anomaly-left"
    - name: "Instance Segmentation Right"
      directory: "anomaly-right"
    - name: "Semantic LIDAR"
      directory: "anomaly-lidar"

name: test-ano-spawn-props
data_dir: ./outputs/test/anomaly/${simulation.world_name}/spawn-props

simulation:
  scene_duration: 30
  world_name: 'Town02'
