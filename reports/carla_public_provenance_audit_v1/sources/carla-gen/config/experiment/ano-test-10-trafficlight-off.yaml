# @package _global_
defaults:
  - override /callbacks: test-clip.yaml

callbacks:
  anomaly:
    _target_: carlagen.callback.OffTrafficLightCallback
    scheduler_mode: "frequency"
    frequency: 1
    duration: [50,70]
    seed: ${seed}
    scheduler_seed: ${seed}
    sensors:
      - name: "Instance Segmentation"
        directory: "anomaly-front"
      # - name: "Instance Segmentation Rear"
      #   directory: "anomaly-rear"
      # - name: "Instance Segmentation Left"
      #   directory: "anomaly-left"
      # - name: "Instance Segmentation Right"
      #   directory: "anomaly-right"
      # - name: "Semantic LIDAR"
      #   directory: "anomaly-lidar"

name: test-ano-traffic-light-off
data_dir: ./outputs/test/anomaly/${simulation.world_name}/traffic-light-off


simulation:
  scene_duration: 30
  world_name: 'Town02'
