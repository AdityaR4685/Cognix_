[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognix-uncertainty-framework"
version = "0.1.0"
description = "A domain-agnostic, uncertainty-aware multi-agent AI decision framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "COGNIX Contributors"}]
requires-python = ">=3.10"
keywords = ["uncertainty", "multi-agent", "bayesian", "conformal", "epistemic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = ["torch>=2.0", "networkx>=3.0"]
vision = ["torch>=2.0", "torchvision>=0.15", "Pillow>=9.0"]
explainability = ["shap>=0.43", "lime>=0.2", "networkx>=3.0"]
carla = ["carla>=0.9.15"]
llm = ["openai>=1.0", "anthropic>=0.20"]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.28", "websockets>=12.0", "httpx>=0.27"]
marl = ["pettingzoo>=1.24"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
    "networkx>=3.0",
    "shap>=0.43",
    "lime>=0.2",
    "pettingzoo>=1.24",
    "rich>=13.0",
    "click>=8.1",
]
all = [
    "cognix-uncertainty-framework[graph,vision,explainability,llm,dashboard,marl]",
]

[project.urls]
Homepage = "https://github.com/AdityaR4685/Cognix_"
Repository = "https://github.com/AdityaR4685/Cognix_"
Documentation = "https://github.com/AdityaR4685/Cognix_#readme"
Issues = "https://github.com/AdityaR4685/Cognix_/issues"

[tool.setuptools.packages.find]
where = ["."]  
include = ["cognix*"]
exclude = ["cognix.evaluation.reports*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "reports",
    "artifacts",
    "docs",
    "results",
    "simulation",
    "robotics",
    "experiments",
    "scratch",
    ".runtime_v1_*",
    "cognix/adapters/carla",
    "cognix/evaluation",
    "dashboard",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = false
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "assignment",
    "operator",
    "var-annotated",
    "arg-type",
    "union-attr",
    "index",
    "return-value",
    "empty-body",
    "call-overload",
]
exclude = [
    "^reports/",
    "^artifacts/",
    "^docs/",
    "^tests/",
    "^cognix/adapters/carla/",
    "^cognix/evaluation/",
    "^dashboard/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--ignore=tests/test_ground_truth.py",
    "--ignore=tests/unit/test_carla_graph_trainers.py",
    "--ignore=tests/unit/test_annotation_app_smoke.py",
    "--ignore=tests/unit/test_dashboard.py",
    "--ignore=tests/unit/test_pedestrian_safety_audit.py",
    "--ignore=tests/unit/test_cognix_live_demo_v2.py",
    "--ignore=tests/unit/test_carla_demo_runner.py",
]
