name: Publish package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - gat-testing-complete-checkpoint

jobs:
  test-core:
    name: Core Framework Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,dashboard]
    - name: Test Core Library with pytest
      run: |
        pytest tests/ -m "not research_assets"
    - name: Run Ground Truth Mathematical Verification
      run: |
        python tests/test_ground_truth.py

  lint-core:
    name: Core Generic Framework Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    - name: Lint Generic Core with Ruff
      run: |
        ruff check cognix/ tests/unit/test_pipeline_contract.py
    - name: Type check Generic Core with mypy
      run: |
        mypy cognix/

  demo-and-dashboard-validation:
    name: Portable Demo and Dashboard Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,dashboard]
        pip install opencv-python-headless flask
    - name: Test Portable Demo and Dashboard Modules
      run: |
        pytest tests/unit/test_annotation_app_smoke.py tests/unit/test_dashboard.py tests/unit/test_pedestrian_safety_audit.py

  build-and-validate:
    name: Build and Validate Package Artifacts
    needs: [test-core, lint-core, demo-and-dashboard-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install build and validation tools
      run: |
        python -m pip install --upgrade pip build twine
    - name: Build wheel and source distribution
      run: |
        python -m build
    - name: Validate distribution archives metadata
      run: |
        twine check --strict dist/*
    - name: Test built wheel in an isolated clean environment
      run: |
        python -m venv /tmp/wheel_test_env
        /tmp/wheel_test_env/bin/pip install --upgrade pip
        /tmp/wheel_test_env/bin/pip install dist/cognix_uncertainty_framework-0.1.0-py3-none-any.whl
        cd /tmp
        /tmp/wheel_test_env/bin/python -c "
        import cognix
        print('cognix imported from:', cognix.__file__)
        assert '${{ github.workspace }}' not in cognix.__file__, 'Import leaked from source tree!'
        assert cognix.__version__ == '0.1.0', f'Unexpected version: {cognix.__version__}'

        from cognix.engine.decision_engine import DecisionEngine
        from cognix.config.schema import CognixConfig
        from cognix.belief.fusion import EpistemicWeightedFusion
        from cognix.calibration.conformal import ConformalPredictor
        from cognix.agents.base import StandardAgent
        from cognix.agents.registry import AgentRegistry

        config = CognixConfig()
        fuser = EpistemicWeightedFusion()
        engine = DecisionEngine(config=config, belief=fuser, graph='no_graph', mode='production')
        assert engine is not None
        print('Wheel package isolation and smoke test passed!')
        "
    - name: Test built sdist in an isolated clean environment
      run: |
        python -m venv /tmp/sdist_test_env
        /tmp/sdist_test_env/bin/pip install --upgrade pip
        /tmp/sdist_test_env/bin/pip install dist/cognix_uncertainty_framework-0.1.0.tar.gz
        cd /tmp
        /tmp/sdist_test_env/bin/python -c "
        import cognix
        print('cognix imported from:', cognix.__file__)
        assert '${{ github.workspace }}' not in cognix.__file__, 'Import leaked from source tree!'
        assert cognix.__version__ == '0.1.0', f'Unexpected version: {cognix.__version__}'

        from cognix.engine.decision_engine import DecisionEngine
        from cognix.config.schema import CognixConfig
        from cognix.belief.fusion import EpistemicWeightedFusion

        config = CognixConfig()
        fuser = EpistemicWeightedFusion()
        engine = DecisionEngine(config=config, belief=fuser, graph='no_graph', mode='production')
        assert engine is not None
        print('Sdist package isolation and smoke test passed!')
        "
    - name: Upload validated package distribution archives
      uses: actions/upload-artifact@v4
      with:
        name: cognix-distribution-packages
        path: dist/
        if-no-files-found: error
        retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [test-core, lint-core, demo-and-dashboard-validation, build-and-validate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cognix-uncertainty-framework
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download validated distribution packages
      uses: actions/download-artifact@v4
      with:
        name: cognix-distribution-packages
        path: dist
    - name: Verify package archives integrity
      run: |
        ls -la dist/
        test -f dist/cognix_uncertainty_framework-0.1.0-py3-none-any.whl
        test -f dist/cognix_uncertainty_framework-0.1.0.tar.gz
        total_files=$(find dist -maxdepth 1 -type f | wc -l)
        if [ "$total_files" -ne 2 ]; then
          echo "Expected exactly 2 distribution archives in dist/, found $total_files"
          exit 1
        fi
    - name: Publish to PyPI via Trusted Publishing (OIDC)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
