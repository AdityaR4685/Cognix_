name: Publish package to PyPI

on:
  release:
    types: [published]

jobs:
  test-core:
    name: Core Framework Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,dashboard]
    - name: Test Core Library with pytest
      run: |
        pytest tests/ -m "not research_assets"
    - name: Run Ground Truth Mathematical Verification
      run: |
        python tests/test_ground_truth.py

  lint-core:
    name: Core Generic Framework Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    - name: Lint Generic Core with Ruff
      run: |
        ruff check cognix/ tests/unit/test_pipeline_contract.py
    - name: Type check Generic Core with mypy
      run: |
        mypy cognix/

  publish-pypi:
    name: Build and Publish to PyPI
    needs: [test-core, lint-core]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cognix-uncertainty-framework
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install build and validation tools
      run: |
        python -m pip install --upgrade pip build twine
    - name: Build wheel and source distribution
      run: |
        python -m build
    - name: Validate package distribution archives
      run: |
        twine check dist/*
    - name: Publish to PyPI via Trusted Publishing (OIDC)
      uses: pypa/gh-action-pypi-publish@release/v1
